[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamefi-roi"
version = "0.1.0"
description = "Strategy-specific GameFi ROI analytics platform skeleton."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "fastapi==0.115.6",
    "google-api-python-client==2.199.0",
    "google-auth-oauthlib==1.4.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "sentry-sdk[fastapi]==2.68.0",
    "SQLAlchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
gamefi-doctor = "app.doctor.checks:main"
youtube-publisher = "app.publishing.youtube_cli:main"
video-narration = "app.publishing.elevenlabs_cli:main"
x-publisher = "app.distribution.x_publishing_cli:main"
distribution-worker = "app.publishing.distribution_worker:main"
content-inventory = "app.content_inventory.cli:main"
long-form-enrichment = "app.content_enrichment.cli:main"
content-package = "app.content_package.cli:main"
video-render = "app.video_render.cli:main"
short-youtube-handoff = "app.publishing.short_youtube_handoff_cli:main"
nvidia-ai = "app.ai.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

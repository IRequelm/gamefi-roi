# Low-cost public beta Render Blueprint.
#
# This file intentionally uses only free Render resources where supported:
# - one Free Web Service
# - one Free Render Postgres database
# - no Render Cron Job, because Cron Jobs have paid billing
#
# Scheduled recalculation for this beta shape is handled by:
# .github/workflows/render-beta-recalculation.yml
#
# For real production, use render.production.yaml instead.
services:
  - type: web
    name: gamefi-roi-web
    runtime: python
    plan: free
    region: ohio
    buildCommand: "python -m pip install --upgrade pip && python -m pip install -r requirements.txt"
    startCommand: "python -m alembic -c backend/alembic.ini upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/ops/status
    autoDeployTrigger: off
    envVars:
      - key: GAMEFI_ENVIRONMENT
        value: production
      - key: GAMEFI_DATABASE_URL
        fromDatabase:
          name: gamefi-roi-db
          property: connectionString
      - key: GAMEFI_API_TITLE
        value: GameFi ROI API
      - key: GAMEFI_LOG_LEVEL
        value: INFO
      - key: GAMEFI_ALLOW_SQLITE_FOR_TESTS
        value: "false"
      - key: GAMEFI_DATABASE_POOL_SIZE
        value: "2"
      - key: GAMEFI_DATABASE_MAX_OVERFLOW
        value: "1"
      - key: GAMEFI_DATABASE_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: GAMEFI_DATABASE_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: GAMEFI_SECURITY_HEADERS_ENABLED
        value: "true"
      - key: GAMEFI_SCHEDULER_CADENCE_MINUTES
        value: "30"
      - key: GAMEFI_PRODUCTION_HARD_STALE_SECONDS
        value: "1800"
      - key: GAMEFI_MARKET_DATA_HTTP_TIMEOUT_SECONDS
        value: "10"
      - key: GAMEFI_MARKET_DATA_HTTP_MAX_RETRIES
        value: "2"
      - key: GAMEFI_MARKET_DATA_PRICE_FRESHNESS_SECONDS
        value: "300"
      - key: GAMEFI_COINGECKO_BASE_URL
        value: https://api.coingecko.com/api/v3
      - key: GAMEFI_COINGECKO_API_KEY
        sync: false
      - key: GAMEFI_ALCOR_BASE_URL
        value: https://wax.alcor.exchange/api/v2
      - key: GAMEFI_ATOMICASSETS_BASE_URL
        value: https://wax.api.atomicassets.io
      - key: GAMEFI_WAX_MARKET_OBSERVATION_FRESHNESS_SECONDS
        value: "300"
      - key: GAMEFI_DFK_CHAIN_RPC_URL
        sync: false
      - key: GAMEFI_DFK_CHAIN_OBSERVATION_FRESHNESS_SECONDS
        value: "300"
      - key: GAMEFI_SPLINTERLANDS_BASE_URL
        value: https://api.splinterlands.com
      - key: GAMEFI_SPLINTERLANDS_OBSERVATION_FRESHNESS_SECONDS
        value: "300"

databases:
  - name: gamefi-roi-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"

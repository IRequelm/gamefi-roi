name: Render Beta Recalculation

on:
  schedule:
    # Run every four hours at minute 17 UTC (GitHub may delay busy schedules).
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      calculation_window_minutes:
        description: Calculation window for this manual recovery run; scheduled runs remain four-hourly.
        type: choice
        options:
          - "240"
          - "60"
        default: "240"
        required: true

concurrency:
  group: gamefi-roi-beta-recalculation
  cancel-in-progress: false

jobs:
  recalculate:
    name: Recalculate beta snapshots
    # Production database writes remain disabled unless the operator has
    # explicitly validated the external database connection and enabled them.
    if: ${{ vars.GAMEFI_BETA_DATABASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GAMEFI_ENVIRONMENT: production
      GAMEFI_DATABASE_URL: ${{ secrets.GAMEFI_BETA_DATABASE_URL }}
      GAMEFI_API_TITLE: GameFi ROI API
      GAMEFI_LOG_LEVEL: INFO
      GAMEFI_ALLOW_SQLITE_FOR_TESTS: "false"
      GAMEFI_DATABASE_POOL_SIZE: "1"
      GAMEFI_DATABASE_MAX_OVERFLOW: "0"
      GAMEFI_DATABASE_POOL_TIMEOUT_SECONDS: "30"
      GAMEFI_DATABASE_POOL_RECYCLE_SECONDS: "1800"
      GAMEFI_SECURITY_HEADERS_ENABLED: "true"
      GAMEFI_PUBLIC_BASE_URL: ${{ vars.GAMEFI_PUBLIC_BASE_URL || 'https://gamcryp.com' }}
      GAMEFI_SCHEDULER_CADENCE_MINUTES: ${{ inputs.calculation_window_minutes || '240' }}
      GAMEFI_PRODUCTION_HARD_STALE_SECONDS: "28800"
      GAMEFI_MARKET_DATA_HTTP_TIMEOUT_SECONDS: "10"
      GAMEFI_MARKET_DATA_HTTP_MAX_RETRIES: "2"
      GAMEFI_MARKET_DATA_REQUEST_CACHE_SECONDS: "30"
      GAMEFI_MARKET_DATA_PRICE_FRESHNESS_SECONDS: "21600"
      GAMEFI_COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
      GAMEFI_COINGECKO_API_KEY: ${{ secrets.GAMEFI_COINGECKO_API_KEY }}
      GAMEFI_ALCOR_BASE_URL: https://wax.alcor.exchange/api/v2
      GAMEFI_ATOMICASSETS_BASE_URL: https://wax.api.atomicassets.io
      GAMEFI_WAX_MARKET_OBSERVATION_FRESHNESS_SECONDS: "21600"
      GAMEFI_DFK_CHAIN_RPC_URL: ${{ secrets.GAMEFI_DFK_CHAIN_RPC_URL }}
      GAMEFI_DFK_CHAIN_OBSERVATION_FRESHNESS_SECONDS: "21600"
      # The current DFK chain source returns no positive current cJEWEL balance.
      # Keep those strategies stale/visible instead of producing repeated job failures.
      GAMEFI_DFK_JEWELER_REFRESH_ENABLED: "false"
      GAMEFI_SPLINTERLANDS_BASE_URL: https://api.splinterlands.com
      GAMEFI_SPLINTERLANDS_OBSERVATION_FRESHNESS_SECONDS: "21600"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run scheduled recalculation
        run: python -m app.jobs.snapshot_refresh

      - name: Read-only recovery evidence
        if: always()
        run: python -m app.doctor --recovery

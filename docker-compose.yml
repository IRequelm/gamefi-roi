services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamefi_roi
      POSTGRES_USER: gamefi
      POSTGRES_PASSWORD: gamefi_local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamefi -d gamefi_roi"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
